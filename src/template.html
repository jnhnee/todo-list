<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <header><h1>Todo List</h1></header>

    <main id="content">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>Projects</h2>
                <button id="add-project-btn">+ Project</button>
            </div>

            <div id="projects"></div>

        </aside>

        <section id="main-content">
            <div class="todo-header">
                <h2>Inbox</h2>
                <button id="add-todo-btn">+ Todo</button>
            </div>
            <div id="todos"></div>
        </section>
    </main>

    <footer>Made by John N with ❤️</footer>
</body>
</html>
